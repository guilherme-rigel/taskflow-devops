name: TaskFlow - Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Integracao Continua - CI
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes automatizados
        run: npm test

      - name: Verificar vulnerabilidades de producao
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Entrega Continua - CD
    needs: testes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Verificar Docker
        run: docker --version

      - name: Verificar Docker Compose
        run: docker compose version

      - name: Executar deploy automatizado
        run: bash scripts/deploy.sh

      - name: Validar funcionamento da API
        run: |
          curl --fail http://localhost:3000/
          curl --fail http://localhost:3000/health
          curl --fail http://localhost:3000/tarefas

      - name: Exibir logs da aplicacao
        if: always()
        run: docker compose logs --tail=50

      - name: Autenticar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag taskflow:latest "$IMAGE:latest"
          docker tag taskflow:latest "$IMAGE:$GITHUB_SHA"

          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Encerrar ambiente de implantacao
        if: always()
        run: docker compose down